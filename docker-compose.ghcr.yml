# Docker Compose for GHCR (GitHub Container Registry) production image
# Usage: make docker-ghcr
#
# This compose file pulls the pre-built image from GHCR instead of building locally.
# Use docker-compose.yml for local development.

services:
  db-backend-nosql-standard-project:
    image: mongo:6.0.3
    container_name: db-backend-nosql-standard-project-ghcr
    expose:
      - 27017
    restart: always
    ports:
      - ${DATABASE_PORT}:27017
    environment:
      - MONGO_INITDB_DATABASE=${DATABASE_NAME}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default

  api-backend-nosql-standard-project:
    image: ghcr.io/countergank/backend-nosql-standard-project:${NODE_ENV:-development}-${VERSION:-latest}
    container_name: api-backend-nosql-standard-project-ghcr
    restart: always
    depends_on:
      db-backend-nosql-standard-project:
        condition: service_healthy
    ports:
      - ${PORT:-3001}:${PORT:-3001}
    env_file:
      - .env
    environment:
      - DATABASE_PORT=27017
      - DATABASE_HOST=db-backend-nosql-standard-project
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-3001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - default

networks:
  default:
    name: backend-nosql-standard-project-ghcr-net
    driver: bridge
