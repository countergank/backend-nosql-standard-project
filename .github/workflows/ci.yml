name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node
        with:
          fetch-depth: 0

      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    name: Biome Lint
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node

      - run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node

      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node

      - name: Run tests
        run: npm run test:ci

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-node

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: test-results/